services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${FRONTEND_URL:-http://localhost:3000}}
        SITE_URL: ${SITE_URL:-${FRONTEND_URL:-http://localhost:3000}}
        FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    image: ${IMAGE_NAME:-3drgb-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Runtime fallback for server-side fetches (client bundle already baked at build).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-${FRONTEND_URL:-http://localhost:3000}}
      SITE_URL: ${SITE_URL:-${FRONTEND_URL:-http://localhost:3000}}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # SSR inside Docker: reach API via compose service name, not localhost.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://3drgb-api}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - dokploy-network
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./next.config.ts
        - action: rebuild
          path: ./app
        - action: rebuild
          path: ./components
        - action: rebuild
          path: ./lib
        - action: sync+restart
          path: ./public
          target: /app/public

networks:
  dokploy-network:
    external: true
